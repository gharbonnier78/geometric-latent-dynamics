name: Fetch exact LLPNN source paper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-source-paper.yml'
      - 'papers/SOURCE_PAPER_REQUEST.md'

permissions:
  contents: write

jobs:
  fetch-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch arXiv v1 and verify against uploaded source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p papers

          expected='e0a8335592744be93eb7e3d9bc88840ce53fd73736b1388f7b82698d6a1b1051'
          target='papers/2607.28939v1.pdf'

          if [[ -f "$target" ]]; then
            actual="$(sha256sum "$target" | awk '{print $1}')"
            if [[ "$actual" == "$expected" ]]; then
              echo 'Exact source PDF already present.'
              exit 0
            fi
            echo "Existing PDF checksum mismatch: $actual" >&2
            exit 1
          fi

          curl --fail --location --retry 3 \
            'https://arxiv.org/pdf/2607.28939v1' \
            --output "$target"

          actual="$(sha256sum "$target" | awk '{print $1}')"
          echo "Downloaded SHA-256: $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Downloaded PDF is not byte-identical to the source uploaded in the originating chat.' >&2
            rm -f "$target"
            exit 1
          fi

      - name: Commit exact PDF when newly fetched
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- papers/2607.28939v1.pdf && git ls-files --error-unmatch papers/2607.28939v1.pdf >/dev/null 2>&1; then
            echo 'Nothing to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/2607.28939v1.pdf
          git commit -m 'Add exact LLPNN arXiv v1 source paper'
          git push
